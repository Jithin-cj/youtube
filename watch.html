<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Watch</title>
    <link rel="stylesheet" href="index.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        .video-controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
            align-items: end;
            gap: 10px;
            flex: 0 0 auto;
        }

        .link-field label {
            display: block;
            margin-bottom: 5px;
        }

        .link-field input {
            width: 100%;
            margin: 0;
            padding: 9px;
        }

        .video-controls button {
            min-height: 36px;
            padding: 7px 12px;
        }

        .first-video {
            flex: 0 0 auto;
            width: min(50px, 100%);
            aspect-ratio: 16 / 9;
        }

        .first-video iframe,
        .second-video iframe,
        .third-video iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .second-video,
        .third-video {
            flex: 1 1 0;
            min-height: 0;
        }

        @media (max-width: 700px) {
            .video-controls {
                grid-template-columns: 1fr 1fr;
            }

            .video-controls button {
                grid-column: 1 / -1;
            }

            .first-video {
                width: min(240px, 100%);
            }
        }
    </style>
</head>
<body>
    <form class="video-controls" id="videoForm" autocomplete="off">
        <div class="link-field">
            <label for="firstLink">First video (play this for audio)</label>
            <input id="firstLink" type="text" autocomplete="off" placeholder="Paste a YouTube URL or video ID">
        </div>
        <div class="link-field">
            <label for="secondLink">Second video</label>
            <input id="secondLink" type="text" autocomplete="off" placeholder="Paste a YouTube URL or video ID">
        </div>
        <div class="link-field">
            <label for="thirdLink">Third video</label>
            <input id="thirdLink" type="text" autocomplete="off" placeholder="Paste a YouTube URL or video ID">
        </div>
        <button type="submit">Load videos</button>
    </form>

    <section class="first-video" aria-label="First YouTube video player">
        <iframe id="demo" src="" title="First YouTube video — play to hear its audio" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </section>
    <main class="second-video">
        <iframe id="demo2" src="" title="Second YouTube video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </main>
    <section class="third-video" aria-label="Third YouTube video player">
        <iframe id="demo3" src="" title="Third YouTube video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </section>

    <script>
        const params = new URLSearchParams(window.location.search);
        const initialFirstCode = params.get("code") || "";
        const initialSecondCode = params.get("code2") || "";
        const initialThirdCode = params.get("code3") || "";
        const firstLink = document.getElementById("firstLink");
        const secondLink = document.getElementById("secondLink");
        const thirdLink = document.getElementById("thirdLink");
        const firstPlayer = document.getElementById("demo");
        const secondPlayer = document.getElementById("demo2");
        const thirdPlayer = document.getElementById("demo3");

        function getVideoId(value) {
            const input = value.trim();
            if (!input) return "";

            try {
                const url = new URL(input);
                if (url.hostname === "youtu.be" || url.hostname.endsWith(".youtu.be")) {
                    return url.pathname.split("/").filter(Boolean)[0] || "";
                }
                if (url.hostname.includes("youtube.com")) {
                    if (url.pathname === "/watch") return url.searchParams.get("v") || "";
                    const parts = url.pathname.split("/").filter(Boolean);
                    if (["embed", "shorts", "live"].includes(parts[0])) return parts[1] || "";
                }
            } catch {
                // Treat non-URL input as a video ID.
            }

            return input.split(/[?&]/)[0];
        }

        function updatePlayers(firstCode, secondCode, thirdCode) {
            firstLink.value = firstCode || "";
            secondLink.value = secondCode || "";
            thirdLink.value = thirdCode || "";
            firstPlayer.src = firstCode
                ? `https://www.youtube.com/embed/${encodeURIComponent(firstCode)}?mute=0`
                : "";
            secondPlayer.src = secondCode
                ? `https://www.youtube.com/embed/${encodeURIComponent(secondCode)}?mute=1`
                : "";
            thirdPlayer.src = thirdCode
                ? `https://www.youtube.com/embed/${encodeURIComponent(thirdCode)}?mute=1`
                : "";
        }

        // Keep support for links with code/code2/code3 parameters, but immediately remove them from the address bar.
        if (window.location.search || window.location.hash) {
            window.history.replaceState(null, "", window.location.pathname);
        }
        updatePlayers(initialFirstCode, initialSecondCode, initialThirdCode);

        document.getElementById("videoForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const firstCode = getVideoId(firstLink.value);
            const secondCode = getVideoId(secondLink.value);
            const thirdCode = getVideoId(thirdLink.value);
            updatePlayers(firstCode, secondCode, thirdCode);
        });

        // Clear field values when the page is being hidden to avoid browser back-forward cache retention.
        window.addEventListener("pagehide", () => {
            firstLink.value = "";
            secondLink.value = "";
            thirdLink.value = "";
        });
    </script>
</body>
</html>
